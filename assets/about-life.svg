<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">About Thomas Patole</title><desc id="desc">Engineering strengths and professional interests.</desc><defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff" stop-opacity=".24"/><stop offset="1" stop-color="#ff354f" stop-opacity=".18"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7183a5" opacity=".16"/></pattern><style>text{font-family:Inter,Segoe UI,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace} .title{font-size:34px;font-weight:800;fill:#f4f7ff;letter-spacing:-1px} .muted{fill:#aab5ca} .eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;fill:#247bff} .body{font-size:16px;fill:#aab5ca} .chip{font-size:13px;font-weight:650;fill:#f4f7ff} .panel{fill:#0e1728;stroke:#263653;stroke-width:1.2} .enter{animation:rise .8s cubic-bezier(.2,.8,.2,1) both} @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}} @media(prefers-reduced-motion:reduce){.enter{animation:none}}</style></defs><rect width="1000" height="240" rx="22" fill="#070b16"/><rect x="1" y="1" width="998" height="238" rx="21" fill="none" stroke="#263653"/><text x="30" y="39" class="eyebrow">BUILDER MINDSET</text><text x="30" y="78" class="title">Applied AI, end to end.</text><text x="30" y="111" class="body">I connect models, retrieval, data and tools into useful workflows.</text><text x="30" y="137" class="body">I care about grounded answers, reliable orchestration and usable UX.</text><rect x="30" y="160" width="300" height="58" rx="12" class="panel"/><text x="44" y="183" font-size="11" font-weight="800" fill="#ff354f">01</text><text x="74" y="183" font-size="15" font-weight="750" fill="#f4f7ff">RAG systems</text><text x="44" y="203" font-size="11.5" fill="#aab5ca">Ingestion · chunking · embeddings · retrieval</text><rect x="350" y="160" width="300" height="58" rx="12" class="panel"/><text x="364" y="183" font-size="11" font-weight="800" fill="#ff354f">02</text><text x="394" y="183" font-size="15" font-weight="750" fill="#f4f7ff">Agentic workflows</text><text x="364" y="203" font-size="11.5" fill="#aab5ca">Tool use · orchestration · context engineering</text><rect x="670" y="160" width="300" height="58" rx="12" class="panel"/><text x="684" y="183" font-size="11" font-weight="800" fill="#ff354f">03</text><text x="714" y="183" font-size="15" font-weight="750" fill="#f4f7ff">Data copilots</text><text x="684" y="203" font-size="11.5" fill="#aab5ca">Schema linking · SQL generation · analytics</text></svg>